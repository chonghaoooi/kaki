<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kaki screenshot gallery</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1800px; height: 1200px; overflow: hidden; }
    body { font-family: Arial, Helvetica, sans-serif; color: #19172d; background: #f7f5ff; }
    .canvas { width: 1800px; height: 1200px; position: relative; padding: 55px 116px 35px; background: radial-gradient(circle at 90% 1%, #e4e1ff 0, transparent 27%), #f7f5ff; }
    .brand { color: #5147ed; font-size: 79px; font-weight: 800; line-height: 1; letter-spacing: -5px; }
    .eyebrow { position: absolute; right: 116px; top: 74px; padding: 13px 23px; border: 1px solid #d8d3f6; border-radius: 30px; background: #fff; color: #555076; font-size: 21px; font-weight: 600; }
    h1 { margin: 12px 0 4px; font-size: 49px; line-height: 1.15; letter-spacing: -1.5px; }
    .deck { margin: 0; color: #5f5b79; font-size: 26px; line-height: 1.35; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 42px; margin-top: 30px; }
    .card { height: 837px; padding: 19px 20px 18px; border: 1px solid #e0dcf6; border-radius: 38px; background: #eeebfb; box-shadow: 0 18px 44px #3931670d; text-align: center; overflow: hidden; }
    .card h2 { margin: 0 0 8px; color: #5046e5; font-size: 24px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    .card img { display: block; width: auto; max-width: 100%; height: 759px; margin: 0 auto; object-fit: contain; }
    .foot { position: absolute; bottom: 23px; left: 116px; color: #716d88; font-size: 17px; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="brand">kaki</div>
    <div class="eyebrow">Find your people. Make a small plan.</div>
    <h1 id="title"></h1>
    <p class="deck" id="deck"></p>
    <div class="cards" id="cards"></div>
    <div class="foot">Screens from the fictional Northstar Campus browser demo · No real students or live support sessions</div>
  </main>
  <script>
    const slides = {
      discover: { title: 'Small plans. Good company.', deck: 'Meet students through an activity, a club, or a supportive space.', cards: [
        ['Discover', 'demo-discover.png'], ['Find a club', 'demo-clubs.jpg'], ['Find support', 'demo-support.jpg']
      ] },
      connect: { title: 'Go from browsing to belonging.', deck: 'Join a plan, talk in a public club, and keep the conversation going.', cards: [
        ['Your activities', 'demo-activities.jpg'], ['Club chat', 'demo-club-chat.png'], ['Messages', 'demo-messages.jpg']
      ] },
      grow: { title: 'Grow at your own pace.', deck: 'Learn with a peer, reflect privately, or offer a listening ear.', cards: [
        ['Mentor profile', 'demo-mentor-profile.png'], ['Your journey', 'demo-journey.jpg'], ['Listening ear', 'demo-listening-ear.jpg']
      ] },
    };
    const slide = slides[new URLSearchParams(location.search).get('slide')] || slides.discover;
    document.getElementById('title').textContent = slide.title;
    document.getElementById('deck').textContent = slide.deck;
    document.getElementById('cards').innerHTML = slide.cards.map(([label, image]) => `<section class="card"><h2>${label}</h2><img src="${image}" alt="${label} screen"></section>`).join('');
  </script>
</body>
</html>
